[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daxin"
version = "0.1.0.dev0"
description = "答信 (Daxin): third-party acceptance and graded release for customer-service AI answers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.5", "typer>=0.12", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
daxin = "daxin.cli:app"

[tool.setuptools.packages.find]
include = ["daxin*"]

[tool.setuptools.package-data]
daxin = ["examples/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
